<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ToDo" />
    <meta name="description" content="ToDo – cleaner Aufgaben-Planer mit Wochenkalender und Zielen" />
    <title>ToDo</title>
    <script>
      // Theme vor dem ersten Paint anwenden (verhindert Flackern)
      try {
        var s = JSON.parse(localStorage.getItem('todo-theme') || '{}')
        document.documentElement.setAttribute('data-theme-mode', s.mode === 'light' ? 'light' : 'dark')
        if (s.accent) document.documentElement.style.setProperty('--color-primary', s.accent)
      } catch (e) {
        document.documentElement.setAttribute('data-theme-mode', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
